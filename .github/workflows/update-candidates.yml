name: Update candidate tracker data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live tracker data and build candidates.json
        run: |
          curl -s "https://qubic.jetskipool.ai/api/qubic_data.json" -o /tmp/qubic_data.json
          python3 - <<'PYEOF'
          import json, datetime

          targets = {
              'UIHUSNMLSGUKPGIZCVZEIZWMSEHAGOJPNYBSYIEAZFLVJUODQWYGPZCGVUWN': '9950X',
              'BJKDBKIOOTKIXGAMLGRYMLTXMGFDUOYSTFASIFHVCGMPLCUGXEVIXXKHILSC': '79783',
              'OWGQOIHHUQWTPAKGVVWGOETVOUNAJEFXHHYLBYUVECKCTRYSPTNEENACBBNM': 'wallet-test',
          }

          d = json.load(open('/tmp/qubic_data.json'))
          ids = d.get('tracker', {}).get('allIds', d.get('allIds', []))

          candidates = []
          for row in ids:
              ident = row.get('identity') or row.get('id')
              if ident in targets:
                  candidates.append({
                      'label': targets[ident],
                      'identity': ident,
                      'score': row.get('score'),
                      'rank': row.get('rank'),
                      'isComputor': row.get('isComputor'),
                  })

          out = {
              'updated': datetime.datetime.now(datetime.UTC).isoformat(),
              'candidates': candidates,
          }
          with open('docs/candidates.json', 'w') as f:
              json.dump(out, f, indent=2)
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "qubicresearch-bot"
          git config user.email "qubicresearch@proton.me"
          git add docs/candidates.json
          git diff --cached --quiet || git commit -m "Update candidate tracker data [automated]"
          git push
