          for addr in computors:
              path = f'/tmp/firsttx/{addr}.json'
              family = None
              detail = {}
              try:
                  d = json.load(open(path))
                  txs = d.get('transactions', [])
                  if txs:
                      tx = txs[0]['transactions'][0]['transaction']
                      source = tx['sourceId']
                      if source in SEEDERS:
                          family = SEEDERS[source]
                          detail = {'method': 'first-tx', 'seededBy': source, 'amount': tx['amount'], 'tick': tx['tickNumber']}
              except Exception:
                  pass

              if family is None:
                  # Second pass: real outgoing transfer (100M-999M QU) to a known hub.
                  out_path = f'/tmp/outgoing/{addr}.json'
                  try:
                      od = json.load(open(out_path))
                      for e in od.get('eventLogs', []):
                          t = e.get('quTransfer')
                          if t and t['destination'] in SEEDERS:
                              family = SEEDERS[t['destination']]
                              detail = {'method': 'outgoing-payout', 'sentTo': t['destination'], 'amount': t['amount'], 'tick': e['tickNumber']}
                              break
                  except Exception:
                      pass

              if family is None:
                  try:
                      json.load(open(path))
                      family = 'unattributed (not seeded by a known hub)'
                  except Exception:
                      family = 'lookup failed'

              results[addr] = {'family': family, **detail}
              counts[family] = counts.get(family, 0) + 1

          out = {
              'updated': datetime.datetime.now(datetime.UTC).isoformat(),
              'method': 'Real first-ever transaction, then real 100M-999M outgoing transfer, checked against 69 known hub wallets (both MinerLab/JetSki and qli). Not a heuristic.',
              'totalComputors': len(computors),
              'counts': counts,
              'byIdentity': results,
          }
          json.dump(out, open('docs/funding_census.json', 'w'), indent=2)
          print(json.dumps(counts, indent=2))
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "qubicresearch-bot"
          git config user.email "qubicresearch@proton.me"
          git add docs/funding_census.json
          git diff --cached --quiet || git commit -m "Update funding-based census [automated]"
          git pull --rebase origin main
          git push
