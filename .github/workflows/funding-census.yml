name: Funding-based census (real seeding source, not recent destination)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every current computor real seeding + real payout destination
        run: |
          set -e
          mkdir -p /tmp/firsttx /tmp/outgoing
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

          curl -s "https://qubic.jetskipool.ai/api/qubic_data.json" -o /tmp/qubic_data.json
          python3 -c "
          import json
          d = json.load(open('/tmp/qubic_data.json'))
          ids = d.get('tracker', {}).get('allIds', d.get('allIds', []))
          computors = [row.get('identity') or row.get('id') for row in ids if row.get('isComputor')]
          with open('/tmp/computor_list.txt', 'w') as f:
              f.write(chr(10).join(computors))
          print(len(computors), 'current computors to check')
          "

          # Real first-ever transaction per identity (ascending order).
          check_one() {
            addr="$1"
            out="/tmp/firsttx/$addr.json"
            for attempt in 1 2 3; do
              curl -s -A "$UA" --max-time 15 "https://rpc.qubic.org/v2/identities/$addr/transfers?desc=false&pageSize=1&page=0" -o "$out"
              if python3 -c "import json,sys; json.load(open('$out'))" 2>/dev/null; then
                break
              fi
              sleep 1
            done
          }
          export -f check_one
          export UA
          cat /tmp/computor_list.txt | xargs -P 6 -I{} bash -c 'check_one "$@"' _ {}

          # For identities not directly seeded by a known hub, check real outgoing
          # transfers in the 100M-999M QU range (the real epoch-payout signature
          # amounts confirmed throughout this investigation) for a match against the
          # same known-hub list. This second pass is what actually resolved epochs
          # 226/227/228 to zero-unexplained -- first-tx alone misses computors funded
          # via a second hop, a satellite funder, or a QUTIL SendToManyV1 batch call.
          check_outgoing() {
            addr="$1"
            out="/tmp/outgoing/$addr.json"
            for attempt in 1 2 3; do
              curl -s -A "$UA" --max-time 15 -X POST "https://rpc.qubic.org/query/v1/getEventLogs" \
                -H "Content-Type: application/json" \
                -d "{\"filters\":{\"source\":\"$addr\"},\"ranges\":{\"amount\":{\"gte\":\"100000000\",\"lte\":\"999999999\"}},\"pagination\":{\"offset\":0,\"size\":20}}" \
                -o "$out"
              if python3 -c "import json,sys; json.load(open('$out'))" 2>/dev/null; then
                break
              fi
              sleep 1
            done
          }
          export -f check_outgoing
          cat /tmp/computor_list.txt | xargs -P 4 -I{} bash -c 'check_outgoing "$@"' _ {}

          python3 - <<'PYEOF'
